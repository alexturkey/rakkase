name: Bug report / Hata bildirimi
description: Something failed during install or run
body:
  - type: input
    id: ortam
    attributes:
      label: "Machine, versions / Makine, sürümler"
      placeholder: "GTX 1050 Ti 4 GB, 16 GB RAM, Windows 10"
    validations:
      required: true
  - type: input
    id: komut
    attributes:
      label: "Command you ran / Çalıştırdığınız komut"
    validations:
      required: true
  - type: input
    id: cikis-kodu
    attributes:
      label: "Error code and exit code / Hata kodu ve çıkış kodu (e.g. RK-E-DISK, 3)"
      description: "`rakkase.py uret` exit codes: 0 done, 2 plan check error or engine did not start, 3 a track failed, 4 RAM guard stopped it, 5 done but archive failed, 6 `ayarlar.json` missing or wrong. The `HATA: [RK-E-...]` line has the error code: see docs/SIK_HATALAR.md and docs/SORUN_GIDERME.md. / Çıkış kodları yukarıda; docs/SORUN_GIDERME.md."
      placeholder: "6"
    validations:
      required: false
  - type: textarea
    id: tani
    attributes:
      label: "Diagnosis report / Tanı raporu (optional, recommended / isteğe bağlı, önerilir)"
      description: "Run `scripts\tani.ps1`; it writes `tani_raporu.txt` on your computer and masks your paths and user name. Paste its content here. Read it before you post: it should hold no name, e-mail or token. / `scripts\tani.ps1` çalıştırın; `tani_raporu.txt` bilgisayarınıza yazılır, yollarınızı ve kullanıcı adınızı maskeler. İçeriği buraya yapıştırın; göndermeden önce okuyun: ad, e-posta, token olmamalı."
      render: text
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: "First 20 lines of the output / Çıktının ilk 20 satırı (no personal paths please / kişisel yol yok)"
    validations:
      required: true
  - type: textarea
    id: beklenen
    attributes:
      label: "Expected vs what happened / Beklenen ve olan"
  - type: checkboxes
    id: gizlilik
    attributes:
      label: "Privacy / Gizlilik"
      options:
        - label: "I read the output and it holds no personal path, user name, e-mail or token / Çıktıyı okudum, kişisel yol, kullanıcı adı, e-posta ya da token yok"
          required: true
